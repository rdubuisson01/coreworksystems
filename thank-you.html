<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Your Brief Is Ready | Corework Systems</title>
<meta name="description" content="Thanks for your interest in Corework Systems. Your product brief is ready to download.">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ink: #0E1117;
  --navy: #1A3A6B;
  --paper: #F7F5F1;
  --warm: #B85C2A;
  --muted: #76726c;
  --rule: #ddd9d3;
}

html { scroll-behavior: smooth; }

body {
  background: var(--paper);
  color: var(--ink);
  font-family: 'DM Sans', sans-serif;
  font-weight: 300;
  line-height: 1.7;
  font-size: 17px;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 1.5rem 4rem;
  background: var(--paper);
  border-bottom: 1px solid var(--rule);
}
.nav-logo { display: flex; align-items: center; gap: 11px; text-decoration: none; }
.nav-mark { flex-shrink: 0; display: block; }
.nav-wordmark { display: flex; flex-direction: column; line-height: 1; }
.nav-word { font-family: 'DM Serif Display', serif; font-size: 1.18rem; color: var(--ink); letter-spacing: -0.01em; line-height: 1; }
.nav-systems { display: flex; align-items: center; gap: 5px; margin-top: 4px; font-family: 'DM Sans', sans-serif; font-size: 0.5rem; font-weight: 500; letter-spacing: 0.26em; text-transform: uppercase; color: var(--warm); }
.nav-systems i { height: 1px; width: 14px; background: var(--warm); display: block; }

.nav-links { display: flex; align-items: center; gap: 2.5rem; }
.nav-link { font-size: 0.8rem; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); text-decoration: none; transition: color 0.2s; }
.nav-link:hover, .nav-link.active { color: var(--ink); }

.nav-toggle { display: none; background: none; border: none; cursor: pointer; padding: 8px; margin: -8px; }
.nav-toggle span { display: block; width: 22px; height: 1.5px; background: var(--ink); margin: 5px 0; transition: transform 0.2s ease, opacity 0.2s ease; }
.nav-toggle[aria-expanded="true"] span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
.nav-toggle[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
.nav-toggle[aria-expanded="true"] span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }

main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 9rem 2rem 4rem; }

.confirm-box { max-width: 560px; text-align: center; }
.eyebrow { font-size: 0.72rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--warm); margin-bottom: 1.4rem; }
.confirm-box h1 { font-family: 'Cormorant Garamond', serif; font-size: clamp(2rem, 4vw, 2.8rem); font-weight: 300; line-height: 1.2; color: var(--navy); margin-bottom: 1.2rem; }
.confirm-box p { color: var(--muted); margin-bottom: 2.2rem; }
.confirm-box p strong { color: var(--ink); font-weight: 500; }

.download-btn {
  display: inline-block; font-size: 0.85rem; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase;
  background: var(--navy); color: #fff; text-decoration: none; padding: 1.1rem 2.4rem;
  border: none; cursor: pointer; transition: background 0.2s;
}
.download-btn:hover { background: var(--ink); }

.secondary-line { margin-top: 2rem; font-size: 0.92rem; color: var(--muted); }
.secondary-line a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--rule); padding-bottom: 2px; }
.secondary-line a:hover { color: var(--warm); border-color: var(--warm); }

footer { background: var(--ink); padding: 3rem 4rem; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,255,255,0.06); }
.footer-logo { display: flex; align-items: center; gap: 10px; }
.footer-lockup { display: flex; flex-direction: column; line-height: 1; }
.footer-word { font-family: 'DM Serif Display', serif; font-size: 1.05rem; color: #fff; letter-spacing: -0.01em; }
.footer-systems { display: flex; align-items: center; gap: 4px; margin-top: 4px; font-size: 0.46rem; font-weight: 500; letter-spacing: 0.24em; text-transform: uppercase; color: var(--warm); }
.footer-systems i { height: 1px; width: 11px; background: var(--warm); display: block; }
.footer-copy { font-size: 0.78rem; color: rgba(255,255,255,0.3); letter-spacing: 0.06em; }
.footer-link { font-size: 0.78rem; color: rgba(255,255,255,0.4); text-decoration: none; letter-spacing: 0.1em; text-transform: uppercase; }
.footer-link:hover { color: var(--warm); }

@media (max-width: 900px) {
  nav { padding: 1.2rem 2rem; }
  .nav-toggle { display: block; }
  .nav-links {
    display: none;
    position: absolute;
    top: 100%; left: 0; right: 0;
    flex-direction: column;
    align-items: flex-start;
    gap: 1.4rem;
    background: var(--paper);
    border-bottom: 1px solid var(--rule);
    padding: 1.8rem 2rem 2.2rem;
  }
  .nav-links.open { display: flex; }
  footer { flex-direction: column; gap: 1rem; text-align: center; padding: 2rem; }
}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo" aria-label="Corework Systems home">
    <svg class="nav-mark" width="23" height="26" viewBox="0 0 34 38" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect x="0"  y="1"  width="34" height="7.5" rx="1.5" fill="#1A3A6B"/>
      <rect x="5"  y="14" width="29" height="7.5" rx="1.5" fill="#B85C2A"/>
      <rect x="11" y="27" width="23" height="7.5" rx="1.5" fill="#1A3A6B" opacity="0.35"/>
    </svg>
    <span class="nav-wordmark">
      <span class="nav-word">Corework</span>
      <span class="nav-systems"><i></i>Systems<i></i></span>
    </span>
  </a>
  <div class="nav-links" id="nav-links">
    <a href="index.html" class="nav-link">Home</a>
    <a href="how-we-help.html" class="nav-link">How We Help</a>
    <a href="insights.html" class="nav-link">Insights</a>
    <a href="about.html" class="nav-link">About</a>
    <a href="contact.html" class="nav-link">Contact</a>
  </div>
  <button class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="nav-links" aria-label="Toggle navigation">
    <span></span><span></span><span></span>
  </button>
</nav>

<main>
  <div class="confirm-box">
    <p class="eyebrow">Your Brief Is Ready</p>
    <h1 id="headline">Thanks — here's your brief.</h1>
    <p id="subtext">Your copy is ready to download.</p>
    <a href="#" id="download-link" class="download-btn">Download the Brief →</a>
    <p class="secondary-line">Prefer to talk now? <a href="contact.html#contact">Let's talk</a>.</p>
  </div>
</main>

<footer>
  <div class="footer-logo">
    <svg class="footer-mark" width="20" height="23" viewBox="0 0 34 38" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect x="0"  y="1"  width="34" height="7.5" rx="1.5" fill="#1A3A6B"/>
      <rect x="5"  y="14" width="29" height="7.5" rx="1.5" fill="#B85C2A"/>
      <rect x="11" y="27" width="23" height="7.5" rx="1.5" fill="#1A3A6B" opacity="0.45"/>
    </svg>
    <span class="footer-lockup">
      <span class="footer-word">Corework</span>
      <span class="footer-systems"><i></i>Systems<i></i></span>
    </span>
  </div>
  <div class="footer-copy">© 2026 Corework Systems</div>
  <a href="https://www.linkedin.com/in/richard-dubuisson/" target="_blank" class="footer-link">LinkedIn</a>
</footer>

<script>
var navToggle = document.getElementById('nav-toggle');
var navLinks = document.getElementById('nav-links');
navToggle.addEventListener('click', function() {
  var isOpen = navLinks.classList.toggle('open');
  navToggle.setAttribute('aria-expanded', String(isOpen));
});
navLinks.querySelectorAll('.nav-link').forEach(function(link) {
  link.addEventListener('click', function() {
    navLinks.classList.remove('open');
    navToggle.setAttribute('aria-expanded', 'false');
  });
});

// Map each product slug to its brief file and display name
var briefs = {
  'manager-effectiveness': { file: 'Corework_Manager_Effectiveness_Program_Brief.pdf', name: 'Manager Effectiveness Program' },
  'leadership-pathway': { file: 'Corework_Leadership_Pathway_Brief.pdf', name: 'Corework Leadership Pathway' },
  'succession-mobility': { file: 'Corework_Succession_Internal_Mobility_Design_Brief.pdf', name: 'Succession & Internal Mobility Design' },
  'strategy-intensive': { file: 'Corework_Workforce_Talent_Strategy_Intensive_Brief.pdf', name: 'Workforce & Talent Strategy Intensive' },
  'workforce-diagnostic': { file: 'Corework_Workforce_System_Diagnostic_Brief.pdf', name: 'Workforce System Diagnostic' }
};

var params = new URLSearchParams(window.location.search);
var slug = params.get('brief');
var entry = briefs[slug];
var link = document.getElementById('download-link');
var subtext = document.getElementById('subtext');

if (entry) {
  var url = 'briefs/' + entry.file;
  link.href = url;
  link.setAttribute('download', entry.file);
  subtext.innerHTML = 'Your copy of the <strong>' + entry.name + '</strong> brief is ready to download.';
} else {
  document.getElementById('headline').textContent = "We couldn't find that brief.";
  subtext.innerHTML = 'Head back to <a href="how-we-help.html">How We Help</a> to find the right one, or reach out and we\'ll send it directly.';
  link.style.display = 'none';
}
</script>

</body>
</html>
